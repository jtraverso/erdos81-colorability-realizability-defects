status:
  scope: >-
    The eighteen statements are proved for arbitrary finite conflict systems, multisets, weights
    and q ≥ 1 (Theorem 3.4 for q > 0 and an optimum with all coordinates at most one), for
    arbitrary finite bipartite multigraphs and host sets, and for every finite SimpleGraph with
    a non-edge u, v (Theorems 6.1–7.3). Known gaps relative to the paper: Corollaries 3.2a, 3.2b,
    4.6, 7.3a, Lemmas 3.5 and 6.2k, Propositions 5.1, 7.1 (the pure-profile packing number), 7.1a, 7.1b, the SEAL statements of Section
    8 (Propositions 8.1, 8.2, Theorem 8.3) and Proposition 9.3 are proved in the library but not
    stated in the Challenge; the SEAL implementation, its benchmarks and runtime model, and the
    enumeration of maximum packings in Section 9 are computations outside the formalization; the
    equality case of Corollary 6.2a at K₄ ⊔ K₄ is not stated.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

