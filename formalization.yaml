version: "v0.4"

project:
  name: "Colorability and realizability defects in resource-dominated packing relaxations"
  description: >-
    A Lean 4 / Mathlib formalization of the main results of the author's preprint "Colorability
    and Realizability Defects in Resource-Dominated Packing Relaxations" (Erdős #81 series, Paper
    V). For a conflict system (finite objects with a symmetric irreflexive conflict relation) and a
    multiset X of objects, the loss between fractional and integral packings is bounded by the
    colourability defect D_q of the conflict graph H[X] of the copies (Lemma 3.1, Corollary 3.2,
    Theorems 3.3, 3.4, 3.4w), and, more generally, by the cost of a realizability certificate whose
    classes are realized in a fixed target system (Theorems 4.2 and 4.4). Applications: host
    completion through list edge colouring of bipartite multigraphs (Theorem 5.2: Galvin and
    Borodin–Kostochka–Woodall; Corollary 5.3; Example 5.5, a quadratic separation on K_{r,r}), the
    vertex-copy inequalities ν₃*(G_{v→u}) + ν₃*(G_{u→v}) ≤ 2ν₃*(G),
    ν₃(G_{v→u}) + ν₃(G_{u→v}) ≤ 2ν₃(G) + oct(H[T₂]) and ≤ 3ν₃(G) for triangle packings (Theorems
    6.1, 6.2, Corollary 6.2a) and mixed triangle/K₄ copy inequalities (Theorem 7.3). Eighteen
    statements in all.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

